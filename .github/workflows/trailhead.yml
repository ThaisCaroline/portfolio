# Atualiza o cartão do Trailhead no site. Só roda quando você pedir:
# GitHub > aba Actions > "Atualizar Trailhead" > Run workflow
name: Atualizar Trailhead

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trailhead Stats
        # Fixada no commit exato da v2.0.0 (segurança: action de terceiros com permissão de escrita)
        uses: nabondance/trailhead-stats@37bf64a484dddfb7c9adf682dcd96c8399680a20
        with:
          trailhead-username: 'tsouza35'
          display-file: 'index.html'
          file-format: 'html'
          display-type: 'card'
          card-path: 'img/trailhead'
          dark-style: 'dark'
          show-certification: 'detail'
          show-badge: 'number'
          show-superbadge: 'icon'
          show-event-badge: 'hidden'
          show-stamp: 'hidden'
